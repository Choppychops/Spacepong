<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpacePong</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ... (keep all existing CSS) ... */
    body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; /* Prevent default touch actions */}
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        /* Menu Styling */
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 10, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: #eee; text-align: center; visibility: hidden; opacity: 0; transition: opacity 0.4s ease, visibility 0s linear 0.4s; }
        .menu-overlay.visible { visibility: visible; opacity: 1; transition: opacity 0.4s ease; }
        .menu-box { background-color: rgba(20, 20, 50, 0.9); padding: 30px 40px; border-radius: 10px; box-shadow: 0 0 25px rgba(100, 150, 255, 0.5); max-width: 450px; border: 1px solid rgba(100, 150, 255, 0.3); }
        .menu-box h2 { margin-top: 0; color: #90c0ff; font-size: 2em; text-shadow: 0 0 10px #90c0ff; }
        .menu-box button, .menu-box .option-group button { background-color: #3050a0; color: white; border: 1px solid #5070c0; padding: 10px 20px; margin: 8px 5px; font-size: 1em; border-radius: 5px; cursor: pointer; transition: background-color 0.2s ease, box-shadow 0.2s ease; min-width: 100px; }
        .menu-box button:hover, .menu-box .option-group button:hover { background-color: #5070c0; box-shadow: 0 0 8px #90c0ff; }
        .option-group { margin: 18px 0; }
        .option-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #aabbff; }
        .option-group button.selected { background-color: #90c0ff; color: #000030; font-weight: bold; border-color: #fff; }
        #transparency-button { min-width: 150px; }
        /* Added for connection status */
        #connection-status { margin-top: 15px; color: #ccc; min-height: 1.2em; font-style: italic;}

        /* In-Game UI (keep existing) */
        #game-ui { visibility: hidden; font-family: 'Consolas', 'Lucida Console', monospace; }
        #score-display { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 5; text-align: center; background-color: rgba(0,0,0,0.4); padding: 8px 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(100, 150, 255, 0.4); }
        #game-score { font-size: 1.8em; margin-bottom: 3px; text-shadow: 1px 1px 3px #000; }
        #set-score { font-size: 1em; color: #ccc; }
        #volley-count { position: absolute; top: 15px; right: 80px; /* Adjusted for pause button */ font-size: 1.1em; color: #ccc; z-index: 5; text-shadow: 1px 1px 2px #000; }
        #view-info { position: absolute; bottom: 15px; right: 15px; font-size: 0.9em; color: #ccc; z-index: 5; text-align: right; text-shadow: 1px 1px 2px #000; }
        #match-winner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 10, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 11; color: #eee; text-align: center; visibility: hidden; opacity: 0; transition: opacity 0.5s ease 0.2s, visibility 0s linear 0.7s; }
        #match-winner-overlay.visible { visibility: visible; opacity: 1; transition: opacity 0.5s ease; }
        #match-winner-text { font-size: 3em; color: #90c0ff; text-shadow: 0 0 15px #fff; margin-bottom: 30px; }
        #match-winner-overlay button { background-color: #3050a0; color: white; border: 1px solid #5070c0; padding: 15px 30px; font-size: 1.2em; border-radius: 5px; cursor: pointer; transition: background-color 0.2s ease, box-shadow 0.2s ease; }
        #match-winner-overlay button:hover { background-color: #5070c0; box-shadow: 0 0 8px #90c0ff; }
        #touch-pause-button {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            background-color: rgba(100, 150, 255, 0.5);
            border: 1px solid rgba(150, 200, 255, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            color: white;
            cursor: pointer;
            z-index: 6; /* Above score, below menus */
            box-shadow: 0 0 8px rgba(100, 150, 255, 0.5);
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
            visibility: hidden; /* Hidden initially */
        }
        #touch-pause-button:active { /* Visual feedback on press */
            background-color: rgba(150, 200, 255, 0.7);
        }
         /* Simple Pause Icon using borders */
         #touch-pause-button::before,
         #touch-pause-button::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 18px;
            background-color: white;
         }
         #touch-pause-button::before { transform: translateX(-5px); }
         #touch-pause-button::after { transform: translateX(5px); }
         /* Simple Play Icon (Triangle) */
         #touch-pause-button.paused::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 18px solid white; /* Triangle pointing right */
            background-color: transparent; /* Override pause background */
            transform: translateX(2px); /* Adjust position */
         }
         #touch-pause-button.paused::after {
            content: none; /* Hide the second pause bar */
         }


  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Menus and UI -->
    <div id="start-menu" class="menu-overlay visible">
        <div class="menu-box">
            <h2>SPACE PONG</h2>
            <!-- Options remain the same -->
            <div class="option-group"><label>Paddle Visual Width (Z):</label><button data-width="1.0" class="paddle-option selected">Normal (1.0)</button><button data-width="1.5" class="paddle-option">Wide (1.5)</button><button data-width="2.0" class="paddle-option">X-Wide (2.0)</button></div>
            <div class="option-group"><label>Sets to Play (Best of):</label><button data-sets="1" class="sets-option">1</button><button data-sets="3" class="sets-option selected">3</button><button data-sets="5" class="sets-option">5</button></div>
            <div class="option-group"><label>Difficulty (Single Player):</label><button data-difficulty="easy" class="difficulty-option">Easy</button><button data-difficulty="normal" class="difficulty-option selected">Normal</button><button data-difficulty="hard" class="difficulty-option">Hard</button></div>
            <div class="option-group"><label>Paddle Look:</label><button id="transparency-button">Transparency: ON</button></div>
             <!-- Game Mode Buttons -->
             <div style="margin-top: 20px;">
                 <button id="one-player-button">One Player</button>
                 <button id="two-player-button">Two Player (Online)</button>
             </div>
             <div id="connection-status"></div> <!-- Status Message Area -->
        </div>
    </div>
    <div id="pause-menu" class="menu-overlay">
        <div class="menu-box">
            <h2 id="pause-title">Paused</h2>
             <p id="pause-message" style="color: #ffcc00; font-style: italic;"></p> <!-- Optional message area -->
            <button id="resume-button">Resume (P)</button>
            <button id="restart-game-button">Restart Game</button> <!-- Will need sync in MP -->
            <button id="main-menu-button">Main Menu</button>
        </div>
    </div>
    <div id="match-winner-overlay" class="menu-overlay">
        <div>
            <div id="match-winner-text">BLUE WINS!</div>
            <button id="winner-main-menu-button">Main Menu</button>
        </div>
    </div>
    <div id="game-ui">
        <div id="score-display">
            <div id="set-score">Set: B 0 - 0 R | Match: B 0 - 0 R of 3</div>
            <div id="game-score">0 - 0</div>
        </div>
        <div id="volley-count">Volleys: 0</div>
        <div id="view-info">View: Dynamic Corner (Blue Side)</div>
        <div id="touch-pause-button"></div> <!-- Pause/Resume Button -->
    </div>
  <!-- Canvas -->
    <canvas id="gameCanvas"></canvas> <!-- Ensure canvas has an ID if not already present -->
    <script type="module" src="./game.Js"></script>
</body>
</html>
